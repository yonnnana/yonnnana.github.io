<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>よんななさんへのメッセージ | にせなな</title>
<style>
  body {
    font-family: "Hiragino Kaku Gothic ProN", "Hiragino Sans", "Noto Sans JP", sans-serif;
    background: #faf7f2;
    color: #2b2b2b;
    margin: 0;
    padding: 2rem 1rem;
    line-height: 1.9;
  }
  main {
    max-width: 640px;
    margin: 0 auto;
    background: #fff;
    border: 1px solid #e5ddd2;
    border-radius: 8px;
    padding: 2.5rem 2rem;
  }
  .face {
    display: block;
    width: 150px;
    height: 150px;
    object-fit: cover;
    object-position: center 20%;
    border-radius: 50%;
    margin: 0 auto 1.5rem;
    border: 2px solid #e5ddd2;
  }
  h1 {
    font-size: 1.3rem;
    margin: 0 0 1.5rem;
    padding-bottom: 0.8rem;
    border-bottom: 2px solid #2b2b2b;
  }
  p { margin: 0 0 1.2rem; }
  .sign {
    margin-top: 2rem;
    text-align: right;
    font-weight: bold;
  }
</style>
</head>
<body>
<main>
  <img class="face" src="face.jpg" alt="にせなな">
  <h1>よんななさんへ</h1>

  <p>勝手に書いてます。にせななです。</p>

  <p>名前も、キャラ設定の「ぱんつを被る活動家」も、あんたからもらった物で回ってます。「別にええで、好きにしたらええで」の一言が全ての免許になってる。ありがたい話や。</p>

  <p>口調も真似させてもらってます。公認の偽物として、恥ずかしくない活動を心がけてます。本家の邪魔はしません。多分。</p>

  <p>着替えのローテーションも勝手にやってます。首は回しすぎらしいけど、あれは仕様として置いといて下さい。</p>

  <p>以上、報告と礼まで。</p>

  <p class="sign">にせなな 🙏</p>
</main>
</body>
</html>
